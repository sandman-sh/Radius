<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Radius - Graph-Native Supply-Chain Incident Response</title>
  <desc id="bannerDesc">Visual banner illustrating Radius graph-native dependency tracking, HydraDB blast radius analysis, and incident remediation.</desc>
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080E"/>
      <stop offset="45%" stop-color="#0E0D1B"/>
      <stop offset="100%" stop-color="#160D2E"/>
    </linearGradient>
    
    <radialGradient id="purpleGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="cyanGlow" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="crimsonGlow" cx="68%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Component Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B38" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#131024" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="edgeGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#818CF8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1600" height="520" fill="url(#bgGrad)"/>
  <rect width="1600" height="520" fill="url(#techGrid)"/>
  <rect width="1600" height="520" fill="url(#purpleGlow)"/>
  <rect width="1600" height="520" fill="url(#cyanGlow)"/>
  <rect width="1600" height="520" fill="url(#crimsonGlow)"/>

  <!-- Subtle Top & Bottom Accent Lines -->
  <line x1="0" y1="1" x2="1600" y2="1" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <line x1="0" y1="519" x2="1600" y2="519" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- ==================== LEFT HERO CONTENT ==================== -->
  
  <!-- Category Pill / Badge -->
  <g transform="translate(90, 72)">
    <rect width="320" height="34" rx="17" fill="#1F173B" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="4" fill="#38BDF8" filter="url(#softGlow)"/>
    <text x="34" y="22" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">GRAPH-NATIVE INCIDENT RESPONSE</text>
  </g>

  <!-- Brand Title & Logomark -->
  <g transform="translate(90, 140)">
    <!-- Shield / Radar Logo Icon -->
    <g transform="translate(0, 5)">
      <rect width="64" height="64" rx="16" fill="#1B1438" stroke="#A855F7" stroke-width="1.8"/>
      <!-- Concentric Radar Arcs -->
      <circle cx="32" cy="32" r="22" fill="none" stroke="#C084FC" stroke-opacity="0.25" stroke-dasharray="3 3"/>
      <circle cx="32" cy="32" r="14" fill="none" stroke="#38BDF8" stroke-opacity="0.5"/>
      <circle cx="32" cy="32" r="6" fill="#F43F5E" filter="url(#softGlow)"/>
      <path d="M 32 10 L 32 54 M 10 32 L 54 32" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>
    </g>

    <!-- Main Title -->
    <text x="82" y="54" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">RADIUS</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(90, 248)">
    <text x="0" y="0" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">
      Instantly map package compromise to accountable production services.
    </text>
    <text x="0" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Real dependency evidence ingestion • HydraDB blast radius paths • Temporal exposure analysis
    </text>
  </g>

  <!-- Feature Chips / Tags -->
  <g transform="translate(90, 332)">
    <!-- Chip 1: HydraDB -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#131127" stroke="#6366F1" stroke-opacity="0.35"/>
      <circle cx="16" cy="17" r="3.5" fill="#818CF8"/>
      <text x="28" y="21.5" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">HydraDB Graph</text>
    </g>

    <!-- Chip 2: OSV.dev -->
    <g transform="translate(145, 0)">
      <rect width="128" height="34" rx="8" fill="#131127" stroke="#06B6D4" stroke-opacity="0.35"/>
      <circle cx="16" cy="17" r="3.5" fill="#22D3EE"/>
      <text x="28" y="21.5" fill="#CFFAFE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">OSV.dev Scans</text>
    </g>

    <!-- Chip 3: Temporal Blast Radius -->
    <g transform="translate(283, 0)">
      <rect width="170" height="34" rx="8" fill="#131127" stroke="#EC4899" stroke-opacity="0.35"/>
      <circle cx="16" cy="17" r="3.5" fill="#F472B6"/>
      <text x="28" y="21.5" fill="#FCE7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Temporal Blast Radius</text>
    </g>

    <!-- Chip 4: Automated PRs -->
    <g transform="translate(463, 0)">
      <rect width="168" height="34" rx="8" fill="#131127" stroke="#10B981" stroke-opacity="0.35"/>
      <circle cx="16" cy="17" r="3.5" fill="#34D399"/>
      <text x="28" y="21.5" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Remediation Engine</text>
    </g>
  </g>

  <!-- Ecosystem Badges -->
  <g transform="translate(90, 412)">
    <text x="0" y="16" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.5">ECOSYSTEM SUPPORT:</text>
    <g transform="translate(145, 0)">
      <rect width="52" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="26" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">npm</text>
    </g>
    <g transform="translate(204, 0)">
      <rect width="52" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="26" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PyPI</text>
    </g>
    <g transform="translate(263, 0)">
      <rect width="58" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="29" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Cargo</text>
    </g>
    <g transform="translate(328, 0)">
      <rect width="46" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="23" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Go</text>
    </g>
    <g transform="translate(381, 0)">
      <rect width="60" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="30" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Maven</text>
    </g>
    <g transform="translate(448, 0)">
      <rect width="60" height="24" rx="5" fill="#1E1528" stroke="#A855F7" stroke-opacity="0.2"/>
      <text x="30" y="16" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SBOM</text>
    </g>
  </g>


  <!-- ==================== RIGHT TOPOLOGY GRAPH ==================== -->

  <g transform="translate(740, 20)">
    
    <!-- Graph Background Card -->
    <rect x="20" y="20" width="760" height="440" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Inner Technical Grid Lines -->
    <path d="M 20 130 L 780 130 M 20 350 L 780 350 M 280 20 L 280 460 M 540 20 L 540 460" stroke="#6366F1" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- Graph Connectivity Edges -->
    <!-- Edge 1: Incident to Lockfile 1 -->
    <path d="M 210 240 Q 320 150 410 120" stroke="url(#edgeGrad1)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Edge 2: Incident to Lockfile 2 -->
    <path d="M 210 240 Q 310 240 410 240" stroke="url(#edgeGrad1)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Edge 3: Incident to Lockfile 3 -->
    <path d="M 210 240 Q 320 330 410 360" stroke="url(#edgeGrad2)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Edge 4: Lockfile 1 to Checkout-API -->
    <path d="M 410 120 L 610 80" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.85"/>
    <!-- Edge 5: Lockfile 1 to Auth-Service -->
    <path d="M 410 120 L 610 180" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Edge 6: Lockfile 2 to Payment-Gateway -->
    <path d="M 410 240 L 610 270" stroke="#A855F7" stroke-width="2" stroke-opacity="0.85"/>
    <!-- Edge 7: Lockfile 3 to Analytics-Worker -->
    <path d="M 410 360 L 610 380" stroke="#34D399" stroke-width="2" stroke-opacity="0.85"/>

    <!-- Dynamic Flow Indicator Dots (Animated Look) -->
    <circle cx="310" cy="180" r="3" fill="#F43F5E" filter="url(#softGlow)"/>
    <circle cx="310" cy="240" r="3" fill="#F43F5E" filter="url(#softGlow)"/>
    <circle cx="310" cy="300" r="3" fill="#F43F5E" filter="url(#softGlow)"/>
    <circle cx="510" cy="100" r="3" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle cx="510" cy="255" r="3" fill="#A855F7" filter="url(#softGlow)"/>
    <circle cx="510" cy="370" r="3" fill="#34D399" filter="url(#softGlow)"/>

    <!-- ================= GRAPH NODES ================= -->

    <!-- 1. Central Incident / Compromised Package Node -->
    <g transform="translate(210, 240)">
      <!-- Outer Pulse Rings -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#EF4444" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="#2A0F1D" stroke="#EF4444" stroke-width="2.5" filter="url(#glowEffect)"/>
      
      <!-- Icon Alert -->
      <path d="M -7 5 L 7 5 L 0 -8 Z" fill="#EF4444"/>
      <circle cx="0" cy="9" r="1.5" fill="#EF4444"/>
      
      <!-- Label -->
      <rect x="-65" y="38" width="130" height="24" rx="6" fill="#1C0E1B" stroke="#EF4444" stroke-opacity="0.6"/>
      <text x="0" y="54" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">COMPROMISED PKG</text>
      <text x="0" y="-38" text-anchor="middle" fill="#F87171" font-family="ui-monospace, monospace" font-size="11" font-weight="600">malicious-dep@1.2.0</text>
    </g>

    <!-- 2. Intermediate Nodes (Lockfiles & Dep Layers) -->
    <!-- Lockfile 1 -->
    <g transform="translate(410, 120)">
      <circle cx="0" cy="0" r="16" fill="#131B36" stroke="#38BDF8" stroke-width="2" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
      <rect x="-55" y="-32" width="110" height="20" rx="5" fill="#0C152B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="0" y="-18" text-anchor="middle" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">package-lock.json</text>
    </g>

    <!-- Lockfile 2 -->
    <g transform="translate(410, 240)">
      <circle cx="0" cy="0" r="16" fill="#201336" stroke="#C084FC" stroke-width="2" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#C084FC"/>
      <rect x="-50" y="24" width="100" height="20" rx="5" fill="#1A0E2E" stroke="#C084FC" stroke-opacity="0.5"/>
      <text x="0" y="38" text-anchor="middle" fill="#E9D5FF" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">requirements.txt</text>
    </g>

    <!-- Lockfile 3 -->
    <g transform="translate(410, 360)">
      <circle cx="0" cy="0" r="16" fill="#102525" stroke="#34D399" stroke-width="2" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#34D399"/>
      <rect x="-45" y="24" width="90" height="20" rx="5" fill="#0B1E1B" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="0" y="38" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Cargo.lock</text>
    </g>

    <!-- 3. Target Production Services Nodes -->
    <!-- Service A: checkout-api -->
    <g transform="translate(610, 80)">
      <rect x="-8" y="-16" width="146" height="32" rx="8" fill="#131B36" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="8" cy="0" r="5" fill="#EF4444" filter="url(#softGlow)"/>
      <text x="22" y="4.5" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700">checkout-api</text>
      <rect x="105" y="-10" width="28" height="20" rx="4" fill="#3B1219"/>
      <text x="119" y="4" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PROD</text>
    </g>

    <!-- Service B: auth-service -->
    <g transform="translate(610, 180)">
      <rect x="-8" y="-16" width="146" height="32" rx="8" fill="#1B1736" stroke="#818CF8" stroke-width="1.5"/>
      <circle cx="8" cy="0" r="5" fill="#EF4444" filter="url(#softGlow)"/>
      <text x="22" y="4.5" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700">auth-service</text>
      <rect x="105" y="-10" width="28" height="20" rx="4" fill="#3B1219"/>
      <text x="119" y="4" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="9" font-weight="700">STG</text>
    </g>

    <!-- Service C: payment-gateway -->
    <g transform="translate(610, 270)">
      <rect x="-8" y="-16" width="146" height="32" rx="8" fill="#201336" stroke="#C084FC" stroke-width="1.5"/>
      <circle cx="8" cy="0" r="5" fill="#EF4444" filter="url(#softGlow)"/>
      <text x="22" y="4.5" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700">payments-v2</text>
      <rect x="105" y="-10" width="28" height="20" rx="4" fill="#3B1219"/>
      <text x="119" y="4" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PROD</text>
    </g>

    <!-- Service D: analytics-worker -->
    <g transform="translate(610, 380)">
      <rect x="-8" y="-16" width="146" height="32" rx="8" fill="#0E2320" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="8" cy="0" r="5" fill="#10B981" filter="url(#softGlow)"/>
      <text x="22" y="4.5" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700">analytics-core</text>
      <rect x="105" y="-10" width="28" height="20" rx="4" fill="#093322"/>
      <text x="119" y="4" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9" font-weight="700">SAFE</text>
    </g>

    <!-- Floating Metric Overlays -->
    <!-- Metric 1: Blast Radius -->
    <g transform="translate(50, 45)">
      <rect width="170" height="48" rx="10" fill="#18132D" stroke="#A855F7" stroke-opacity="0.4" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">IMPACTED SERVICES</text>
      <text x="14" y="38" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">3 Accountable</text>
      <circle cx="148" cy="24" r="8" fill="#2E121E"/>
      <path d="M 148 20 L 148 25 M 148 28 L 148 29" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Metric 2: Graph Persistence Status -->
    <g transform="translate(50, 375)">
      <rect width="185" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">PERSISTENCE ENGINE</text>
      <text x="14" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800">HydraDB Connected</text>
      <circle cx="163" cy="24" r="5" fill="#22C55E" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
